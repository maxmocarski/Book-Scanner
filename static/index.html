<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShelfScan — Library Cataloger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #000000;
            --glass-bg: rgba(20, 20, 28, 0.88);
            --glass-border: rgba(255, 255, 255, 0.16);
            --accent-green: #30d158;
            --accent-amber: #ffd60a;
            --accent-blue: #0a84ff;
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Top Navigation */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--glass-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 10; }
        .brand { font-weight: 800; font-size: 1.1rem; }
        .nav-btns { display: flex; gap: 0.5rem; }
        .btn { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-primary { background: var(--accent-blue); border: none; }

        /* Main Camera View */
        .viewport { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .reticle { width: 220px; height: 300px; border: 2px dashed rgba(255,255,255,0.4); border-radius: 16px; position: absolute; z-index: 2; pointer-events: none; }

        /* Queue Tray Overlay */
        .queue-tray { position: absolute; bottom: 20px; left: 1rem; right: 1rem; background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1rem; z-index: 10; display: flex; flex-direction: column; gap: 0.75rem; }
        .queue-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .queue-items { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
        .queue-thumb { width: 50px; height: 70px; border-radius: 8px; object-fit: cover; border: 2px solid #fff; flex-shrink: 0; }
        
        .shutter-row { display: flex; justify-content: space-between; align-items: center; }
        .shutter-btn { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .shutter-inner { width: 50px; height: 50px; background: #fff; border-radius: 50%; }

        /* Library Modal / Drawer */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 100; display: none; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .book-card { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; display: flex; gap: 1rem; margin-bottom: 1rem; align-items: flex-start; }
        .book-thumb { width: 70px; height: 100px; border-radius: 8px; object-fit: cover; cursor: pointer; }
        .book-info h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
        .book-info p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        .book-summary { font-size: 0.82rem; line-height: 1.3; color: rgba(255,255,255,0.8); }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand">ShelfScan AI</div>
        <div class="nav-btns">
            <button class="btn" onclick="openLibrary()">View Library</button>
            <button class="btn btn-primary" onclick="exportJSON()">Export JSON</button>
        </div>
    </header>

    <main class="viewport">
        <video id="videoFeed" autoplay playsinline></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
        <div class="reticle"></div>

        <div class="queue-tray">
            <div class="queue-header">
                <span id="queueCount">Scan Queue: 0 items</span>
                <span id="processStatus" style="color: var(--accent-amber);"></span>
            </div>
            <div id="queueThumbs" class="queue-items">
                <span style="font-size: 0.8rem; color: var(--text-muted);">Snap book cover or barcode to queue...</span>
            </div>
            <div class="shutter-row">
                <button class="btn" onclick="clearQueue()">Clear Queue</button>
                <button class="shutter-btn" onclick="addToQueue()"><div class="shutter-inner"></div></button>
                <button class="btn btn-primary" onclick="processQueue()">Process Queue</button>
            </div>
        </div>
    </main>

    <!-- Library Catalog Modal -->
    <div id="libraryModal" class="modal">
        <div class="modal-header">
            <h2>Your Library Catalog</h2>
            <button class="btn" onclick="closeLibrary()">Close</button>
        </div>
        <div id="libraryList"></div>
    </div>

    <input type="file" id="coverFileInput" style="display:none;" accept="image/*" onchange="uploadNewCover(event)">

    <script>
        let videoStream = null;
        let queueImages = [];
        let activeCoverBookId = null;

        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('videoFeed').srcObject = videoStream;
            } catch (err) {
                console.error("Camera access denied:", err);
            }
        }

        function addToQueue() {
            const video = document.getElementById('videoFeed');
            const canvas = document.getElementById('captureCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURI = canvas.toDataURL('image/jpeg', 0.85);

            queueImages.push(dataURI);
            updateQueueUI();
        }

        function updateQueueUI() {
            document.getElementById('queueCount').innerText = `Scan Queue: ${queueImages.length} items`;
            const container = document.getElementById('queueThumbs');
            if (queueImages.length === 0) {
                container.innerHTML = `<span style="font-size: 0.8rem; color: var(--text-muted);">Snap book cover or barcode to queue...</span>`;
                return;
            }
            container.innerHTML = queueImages.map(img => `<img src="${img}" class="queue-thumb">`).join('');
        }

        function clearQueue() {
            queueImages = [];
            updateQueueUI();
        }
        
        async function processQueue() {
            if (queueImages.length === 0) return;
            document.getElementById('processStatus').innerText = "Processing...";
            
            const formData = new FormData();
            for (let i = 0; i < queueImages.length; i++) {
                const blob = dataURItoBlob(queueImages[i]);
                formData.append('files', blob, `book_${i}.jpg`);
            }

            try {
                const res = await fetch('/api/scan-queue', { method: 'POST', body: formData });
                const book = await res.json();
                alert(`Successfully cataloged: "${book.title}" by ${book.author}`);
                
                // Clear the queue and reset UI state smoothly
                queueImages = [];
                updateQueueUI();
                
                // Restart video stream track if it got stuck
                const video = document.getElementById('videoFeed');
                if (video.srcObject) {
                    const tracks = video.srcObject.getVideoTracks();
                    tracks.forEach(track => track.enabled = true);
                }
            } catch (err) {
                alert("Error processing queue scan.");
            } finally {
                document.getElementById('processStatus').innerText = "";
            }
        }
        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            return new Blob([ab], { type: mimeString });
        }

        async function openLibrary() {
            document.getElementById('libraryModal').style.display = 'flex';
            const res = await fetch('/api/books');
            const books = await res.json();
            const container = document.getElementById('libraryList');
            
            if (books.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center;">No books in catalog yet.</p>`;
                return;
            }

            container.innerHTML = books.map(b => `
                <div class="book-card">
                    <img src="${b.cover_image}" class="book-thumb" title="Click to change cover" onclick="triggerCoverUpdate(${b.id})">
                    <div class="book-info">
                        <h3>${b.title}</h3>
                        <p><strong>Author:</strong> ${b.author} | <strong>ISBN:</strong> ${b.isbn}</p>
                        <div class="book-summary">${b.summary}</div>
                    </div>
                </div>
            `).join('');
        }

        function closeLibrary() {
            document.getElementById('libraryModal').style.display = 'none';
        }

        function triggerCoverUpdate(bookId) {
            activeCoverBookId = bookId;
            document.getElementById('coverFileInput').click();
        }

        async function uploadNewCover(event) {
            const file = event.target.files[0];
            if (!file || !activeCoverBookId) return;

            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch(`/api/books/${activeCoverBookId}/cover`, { method: 'PUT', body: formData });
            if (res.ok) {
                alert("Cover updated successfully!");
                openLibrary();
            } else {
                alert("Failed to update cover.");
            }
            activeCoverBookId = null;
            event.target.value = '';
        }

        async function exportJSON() {
            window.location.href = '/api/export';
        }

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
