services:
  bookbridge:
    build: .
    container_name: bookbridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8503:8503"
    environment:
      OLLAMA_HOST: http://ollama:11434
      BOOKBRIDGE_MODEL: ${BOOKBRIDGE_MODEL:-gemma3:12b}
      BOOKBRIDGE_TEXT_MODEL: ${BOOKBRIDGE_TEXT_MODEL:-gemma3:1b}
      BOOKBRIDGE_ENRICHMENT: ${BOOKBRIDGE_ENRICHMENT:-cleanup}
      SEARXNG_URL: http://searxng:8080
      BOOKBRIDGE_KEEP_ALIVE: ${BOOKBRIDGE_KEEP_ALIVE:-0}
    volumes:
      - bookbridge-data:/data
    networks:
      - revolt-network
volumes:
  bookbridge-data:
networks:
  revolt-network:
    external: true
    name: revolt_default
